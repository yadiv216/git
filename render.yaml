services:
  - type: web
    name: careersage
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: careersage-user-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CAREERSAGE_STATE_FILE
        value: /var/data/user_state.json
